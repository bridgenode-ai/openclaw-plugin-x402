name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx openclaw plugins build --entry ./dist/index.js --check
      - run: npx openclaw plugins validate --entry ./dist/index.js
      - run: npm test
